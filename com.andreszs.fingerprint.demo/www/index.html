<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *">
		<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />
		<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
		<script src="js/jquery-3.6.0.min.js"></script>
		<title>Cordova Fingerprint AIO Demo</title>
	</head>
	<body class="bg-light">
		<main class="container py-3">
<h1 class="h3 mb-3">cordova-plugin-fingerprint-aio demo</h1>
<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Status</legend>
			<label class="d-block mb-0 alert alert-secondary text-break" id="status" role="status"></label>
		</fieldset>
		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Methods</legend>
			<button class="btn btn-primary mr-2 mb-2" type="button" id="btnIsAvailable">Fingerprint.isAvailable</button><hr />
			<label class="d-block mb-1">Title</label>
			<input class="form-control mb-2" type="text" id="txtTitle" value="" placeholder="<APP_NAME> Biometric Sign On" maxlength="100" />
			<label class="d-block mb-1">Subtitle</label>
			<input class="form-control mb-2" type="text" id="txtSubtitle" value="Confirm demo app by andreszsogon.com" placeholder="null" maxlength="100" />
			<label class="d-block mb-1">Description</label>
			<input class="form-control mb-2" type="text" id="txtDescription" value="disableBackup=false" placeholder="null" maxlength="100" />
			<label class="d-block mb-1">fallbackButtonTitle</label>
			<input class="form-control mb-2" type="text" id="txtFallbackButtonTitle" value="Use backup" placeholder="Use backup" maxlength="60" />
			<label class="d-block mb-1">cancelButtonTitle</label>
			<input class="form-control mb-2" type="text" id="txtCancelButtonTitle" value="Cancel" placeholder="Cancel" maxlength="60" />
			<label class="d-block mb-1"><input class="mr-2" type="checkbox" id="disableBackup" /> disableBackup</label>
			<label class="d-block mb-1"><input class="mr-2" type="checkbox" id="confirmationRequired" checked="checked" /> confirmationRequired</label>
			<button class="btn btn-primary mr-2 mb-2" type="button" id="btnShow">Fingerprint.show</button>
		</fieldset>

<!--<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Events</legend>
			<label id="event" class="text-info d-block mb-0 alert alert-secondary text-break">Waiting for event.</label>
		</fieldset>-->

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3" id="versions">
			<legend class="h5 card-title">Versions</legend>
			<img alt="" class="float-right" src="img/outline_info_black_36dp.png" />
			<label id="app_version" class="text-primary d-block mb-1">App version</label>
			<label id="plugin_version" class="text-primary d-block mb-1">Plugin version</label>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Plugin</legend>
			<label class="d-block mb-1">Refer to README for more info.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnGitHub">GitHub</button>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Demo App</legend>
			<label class="d-block mb-1">Visit website for demo app reference.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnWebsite">Website</button>
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnPluginDemos">Plugin Demos</button>
		</fieldset>

		</main>

		<script type="text/javascript" src="cordova.js"></script>
		<script type="text/javascript" src="js/index.js"></script>
	</body>
</html>
