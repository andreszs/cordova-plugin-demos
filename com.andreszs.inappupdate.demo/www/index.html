<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="connect-src *; default-src * 'self' 'unsafe-inline' 'unsafe-eval' gap: data: ms-appdata: blob: file:; style-src 'self' 'unsafe-inline'; media-src *" />
		<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />
		<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
		<script src="js/jquery-3.6.0.min.js"></script>
		<title>InAppUpdate Plugin Demo</title>
	</head>
	<body class="bg-light">
		<main class="container py-3">
<h1 class="h3 mb-3">cordova-plugin-inappupdates demo</h1>
<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Status</legend>
			<textarea class="form-control mb-2" id="status" rows="5"></textarea>
		</fieldset>
		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Methods</legend>
			<button class="btn btn-primary mr-2 mb-2" type="button" id="getUpdateAvailability">getUpdateAvailability</button><hr />
			<button class="btn btn-primary mr-2 mb-2" type="button" id="updateFlexible">updateFlexible</button>
			<button class="btn btn-primary mr-2 mb-2" type="button" id="updateImmediate">updateImmediate</button><hr />
			<label class="d-block mb-1">Snackbar label text:</label>
			<input class="form-control mb-2" type="text" id="snackbarText" value="Actualización lista para instalar." placeholder="Snackbar text" /><br />
			<label class="d-block mb-1">Snackbar button text:</label>
			<input class="form-control mb-2" type="text" id="snackbarButton" value="REINICIAR" placeholder="Button label" /><br />
			<label class="d-block mb-1">Snackbar button color</label>
			<input class="form-control mb-2" type="text" id="snackbarButtonColor" value="#00E5FF" placeholder="#00E5FF" maxlength="7" /><br />
			<button class="btn btn-primary mr-2 mb-2" type="button" id="setSnackbarOptions">setSnackbarOptions</button>
		</fieldset>

<fieldset class="border rounded bg-white shadow-sm mb-3 p-3" id="versions">
			<legend class="h5 card-title">Versions</legend>
			<img alt="" class="float-right" src="img/outline_info_black_36dp.png" />
			<label id="app_version" class="text-primary d-block mb-1">App version</label>
			<label id="plugin_version" class="text-primary d-block mb-1">Plugin version</label>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Plugin</legend>
			<label class="d-block mb-1">Created by Andres Zsögön. Refer to README for details.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnGitHub">GitHub</button>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Demo App</legend>
			<label class="d-block mb-1">Visit website for demo app reference.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnWebsite">Website</button>
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnPluginDemos">Plugin Demos</button>
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnPlayStore">Play Store</button>
		</fieldset>

		</main>

		<script type="text/javascript" src="cordova.js"></script>
		<script type="text/javascript" src="js/index.js"></script>
	</body>
</html>
