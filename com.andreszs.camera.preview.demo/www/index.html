<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *">
		<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
		<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
		<script src="js/jquery-3.6.0.min.js"></script>
		<title>Camera Preview Demo</title>
	</head>

	<body class="bg-transparent">
		<div class="embed-responsive embed-responsive-1by1" aria-hidden="true"></div>
		<main class="container py-3 bg-light">
<div>
			<h1 class="h3 mb-3">cordova-plugin-camera-preview demo</h1>
			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">Status</legend>
				<label class="d-block mb-0 alert alert-secondary text-break" id="status" role="status"></label>
			</fieldset>
			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">Methods</legend>
				<button class="btn btn-primary mr-2 mb-2" id="btnStartCamera">startCamera</button>
				<button class="btn btn-primary mr-2 mb-2" id="btnStopCamera">stopCamera</button>
				<button class="btn btn-primary mr-2 mb-2" id="btnSwitchCamera">switchCamera</button>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnTakePicture">takePicture</button>
				<button class="btn btn-primary mr-2 mb-2" id="btnTakeSnapshot">takeSnapshot</button>
				<button class="btn btn-primary mr-2 mb-2" id="btnHide">Hide</button>
				<button class="btn btn-primary mr-2 mb-2" id="btnShow">Show</button>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnSetPreviewSize">setPreviewSize</button>
				<input class="form-control mb-2" type="number" id="cpsWidth" placeholder="width" value="" />
				<input class="form-control mb-2" type="number" id="cpsHeight" placeholder="height" value="" />
			</fieldset>

			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">Camera Preview Options</legend>
				X <input class="form-control mb-2" type="number" id="txtCameraX" placeholder="x" value="20" />
				Y <input class="form-control mb-2" type="number" id="txtCameraY" placeholder="y" value="20" />
				W <input class="form-control mb-2" type="number" id="txtCameraWidth" placeholder="width" value="" />
				H <input class="form-control mb-2" type="number" id="txtCameraHeight" placeholder="height" value="" />
				<select class="custom-select mb-2" id="optCameraDirection">
					<option value="back">Back camera</option>
					<option value="front">Front camera</option>
				</select>
				<select class="custom-select mb-2" id="optToBack">
					<option value="true">toBack ON</option>
					<option value="false">toBack OFF</option>
				</select>
				<select class="custom-select mb-2" id="optPreviewDrag">
					<option value="true">previewDrag ON</option>
					<option value="false">previewDrag OFF</option>
				</select>
			</fieldset>

<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">Camera Settings</legend>
				<button class="btn btn-primary mr-2 mb-2" id="btnGetSupportedPictureSizes">getSupportedPictureSizes</button>
				<select class="custom-select mb-2" id="pictureSizes" disabled="disabled">
					<option value="0x0">...</option>
				</select>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnGetSupportedFlashModes">getSupportedFlashModes</button>
				<select class="custom-select mb-2" id="flashModes" disabled="disabled">
					<option value="">...</option>
				</select>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnGetSupportedFocusModes">getSupportedFocusModes</button>
				<select class="custom-select mb-2" id="focusModes" disabled="disabled">
					<option value="">...</option>
				</select>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnGetSupportedColorEffects">getSupportedColorEffects</button>
				<select class="custom-select mb-2" id="colorEffects" disabled="disabled">
					<option value="">...</option>
				</select>
				<hr />
				<button class="btn btn-primary mr-2 mb-2" id="btnGetMaxZoom">getMaxZoom</button>
				<select class="custom-select mb-2" id="zoomSlider" disabled="disabled">
					<option value="zoom">...</option>
				</select>
			</fieldset>

			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">Pictures</legend>
				<label class="d-block mb-1">Plugin-taken picture</label>
				<img src="" alt="" id="originalPicture" / class="img-fluid w-50 d-block">
				<label class="d-block mb-1" id="originalSize">dimensions</label>
				<hr />
				<label class="d-block mb-1">App-cropped picture:</label>
				<img src="" alt="" id="croppedPicture" / class="img-fluid w-50 d-block">
				<label class="d-block mb-1" id="croppedSize">dimensions</label>
			</fieldset>

			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3" id="versions">
				<legend class="h5 card-title">Versions</legend>
				<img alt="" class="float-right" src="img/outline_info_black_36dp.png" />
				<label id="app_version" class="text-primary d-block mb-1">App version</label>
				<label id="plugin_version" class="text-primary d-block mb-1">Plugin version</label>
			</fieldset>

			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">About Plugin</legend>
				<label class="d-block mb-1">Refer to README for details.</label>
				<hr />
				<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnGitHub">GitHub</button>
			</fieldset>

			<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
				<legend class="h5 card-title">About Demo App</legend>
				<label class="d-block mb-1">Visit website for demo app reference.</label>
				<hr />
				<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnWebsite">Website</button>
				<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnPluginDemos">Plugin Demos</button>
			</fieldset>
		</div>

		</main>

		<script type="text/javascript" src="cordova.js"></script>
		<script type="text/javascript" src="js/index.js"></script>
	</body>
</html>
