<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://www.google.com https://www.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *">
		<meta name="format-detection" content="telephone=no">
		<meta name="msapplication-tap-highlight" content="no">
		<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />
		<link rel="icon" href="favicon.ico">
		<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
		<script src="js/jquery-3.6.0.min.js"></script>
		<title>Cordova Recaptcha Enterprise Demo</title>
	</head>
	<body class="bg-light">
		<main class="container py-3">
<h1 class="h3 mb-3">cordova-plugin-recaptcha-enterprise</h1>
<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Status</legend>
			<label class="d-block mb-0 alert alert-secondary text-break" id="status" role="status"></label>
		</fieldset>
		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">reCAPTCHA Enterprise keys</legend>
			<label class="d-block mb-1">android key ID</label>
			<input class="form-control mb-2" type="text" id="sitekeyAndroid" maxlength="100" value="6LdMCfkpAAAAAI7J3cXal47l26BzKZg0UdL7vej0" />
			<label class="d-block mb-1">browser key ID</label>
			<input class="form-control mb-2" type="text" id="sitekeyWeb" maxlength="100" value="6LdSQQAqAAAAANgHfF2H5i7sCmCaQzLwcCnueVq7" />
			<label class="d-block mb-1">userAgent</label>
			<input class="form-control mb-2" type="text" id="userAgent" readonly="readonly" />
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">Methods</legend>
			<button class="btn btn-primary mr-2 mb-2" type="button" id="btnVerify">verify</button>
		</fieldset>

<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">reCAPTCHA Token</legend>
			<textarea class="form-control mb-2" rows="5" id="token"></textarea>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3" id="versions">
			<legend class="h5 card-title">Versions</legend>
			<img alt="" class="float-right" src="img/outline_info_black_36dp.png" />
			<label id="app_version" class="text-primary d-block mb-1">App version</label>
			<label id="plugin_version" class="text-primary d-block mb-1">Plugin version</label>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">App Requirements</legend>
			<ul>
				<li>reCAPTCHA Enterprise keys</li>
				<li>Content-Security-Policy to allow: https://www.google.com, https://www.gstatic.com</li>
			</ul>
		</fieldset>
		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Plugin</legend>
			<label class="d-block mb-1">Refer to README for more info.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnGitHub">GitHub</button>
		</fieldset>

		<fieldset class="border rounded bg-white shadow-sm mb-3 p-3">
			<legend class="h5 card-title">About Demo App</legend>
			<label class="d-block mb-1">Visit website for demo app reference.</label>
			<hr />
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnWebsite">Website</button>
			<button class="btn btn-outline-secondary mr-2 mb-2" type="button" id="btnPluginDemos">Plugin Demos</button>
		</fieldset>

		</main>

		<script type="text/javascript" src="cordova.js"></script>
		<script type="text/javascript" src="js/index.js"></script>
	</body>
</html>
